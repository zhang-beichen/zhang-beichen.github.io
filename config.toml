baseURL = "https://zhang-beichen.github.io/"
title = "Beichen Zhang"
languageCode = "en-us"
enableRobotsTXT = true

[pagination]
pagerSize = 6

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = "github"

[imaging]
  resampleFilter = "Lanczos"
  quality = 85
  anchor = "Smart"

[module]
  [module.hugoVersion]
    extended = true
    min = "0.92.0"

  [[module.imports]]
    path = "github.com/zetxek/adritian-free-hugo-theme"

  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"

  [[module.mounts]]
    source = "assets"
    target = "assets"

  [[module.mounts]]
    source = "i18n"
    target = "i18n"

  [[module.mounts]]
    source = "layouts"
    target = "layouts"

  [[module.mounts]]
    source = "static"
    target = "static"

  [[module.mounts]]
    source = "frontend/bootstrap/scss"
    target = "assets/scss/bootstrap"

  [[module.mounts]]
    source = "frontend/bootstrap/bootstrap.bundle.min.js"
    target = "assets/js/vendor/bootstrap.bundle.min.js"

[params]
  title = "Beichen Zhang"
  description = "Modeling data scientist working at the intersection of climate, geography, energy, and AI."
  images = ["/img/og-img.png"]
  themeColor = "#335c67"
  homepageExperienceCount = 3
  lightbox = false
  viewTransitions = true

  [params.seo]
    siteName = "Beichen Zhang"
    siteDescription = "Professional website for Beichen Zhang featuring research, writing, projects, and CV."
    siteImage = "/img/og-img.png"

  [params.seo.person]
    name = "Beichen Zhang"
    url = "https://zhang-beichen.github.io/"
    sameAs = ["https://github.com/zhang-beichen"]

  [params.favicons]
    source = "icons/favicon.png"

  [params.analytics]
    vercelPageInsights = false
    vercelAnalytics = false

    [params.analytics.googleAnalytics]
      enabled = false
      code = ""

    [params.analytics.googleTagManager]
      enabled = false
      code = ""

  [params.languages.selector.disable]
    footer = true
    header = true
    mobileHeader = true

  [params.plugins]
    [[params.plugins.css]]
      URL = "css/custom.css"
    [[params.plugins.css]]
      URL = "css/adritian-icons.css"

    [[params.plugins.js]]
      URL = "js/rad-animations.js"
    [[params.plugins.js]]
      URL = "js/sticky-header.js"
    [[params.plugins.js]]
      URL = "js/library/fontfaceobserver.js"

    [[params.plugins.scss]]
      URL = "scss/adritian.scss"

  [params.blog]
    layout = "default"
    readingProgress = false
    showCategories = true
    showRecentPosts = true
    recentPostCount = 5
    listStyle = "summary"

  [params.sharing]
    enabled = false
    twitter = false
    linkedin = false
    facebook = false
    email = false

[languages]
  [languages.en]
    disabled = false
    languageCode = "en-US"
    languageDirection = "ltr"
    languageName = "English"
    weight = 1

    [languages.en.menus]
      [[languages.en.menus.header]]
        name = "Home"
        URL = "/"
        weight = 1

      [[languages.en.menus.header]]
        name = "About"
        URL = "#about"
        weight = 2

      [[languages.en.menus.header]]
        name = "Experience"
        URL = "/experience"
        weight = 3

      [[languages.en.menus.header]]
        name = "Projects"
        URL = "#client-and-work-section"
        weight = 4

      [[languages.en.menus.header]]
        name = "Writing"
        URL = "/blog"
        weight = 5

      [[languages.en.menus.header]]
        name = "CV"
        URL = "/cv"
        weight = 6

      [[languages.en.menus.footer]]
        name = "Home"
        URL = "/"
        weight = 1

      [[languages.en.menus.footer]]
        name = "Writing"
        URL = "/blog"
        weight = 2

      [[languages.en.menus.footer]]
        name = "CV"
        URL = "/cv"
        weight = 3
